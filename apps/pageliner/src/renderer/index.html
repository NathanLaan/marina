<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- blob:/wasm-unsafe-eval: pdf.js runs its parser in a Vite-bundled Web
         Worker and uses WASM for some image decoders. frame-src blob: data::
         epub.js renders each EPUB section into a blob-backed sandboxed iframe. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: data: blob:; connect-src 'self' data: blob:; font-src 'self' data: blob:; frame-src 'self' blob: data:;" />
    <title>PageLiner</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
